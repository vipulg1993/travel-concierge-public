# ADOT Collector configuration for cross-cloud OTLP export to AWS.
#
# Flow:
#   Agent process → OTLP/HTTP :4318 → batch processor → awsxray exporter → X-Ray
#                                                     → logging exporter (debug)
#
# The awsxray exporter uses the AWS SDK and automatically picks up credentials
# from the standard chain (env vars → ~/.aws → EC2 role → ...). In Cloud Shell
# we set AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from a copy of the
# omni-demo-admin credentials, scoped to X-Ray + CloudWatch Logs write only.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 10s
    send_batch_size: 50
  # Preserve the trace_id format the agent uses (X-Ray-compatible 32-hex)
  resource/add_cloud:
    attributes:
      - key: cloud.provider
        value: gcp
        action: upsert
      - key: service.framework
        value: langgraph
        action: upsert

exporters:
  # Primary: direct X-Ray export (traces → Transaction Search → Omni)
  awsxray:
    region: us-east-1
    index_all_attributes: true

  # Secondary: CloudWatch Logs for structured span JSON (makes debugging easy)
  awscloudwatchlogs:
    region: us-east-1
    log_group_name: /aws/spans/remote-agents
    log_stream_name: activities-gcp
    raw_log: true

  # Local debug — prints to the collector's stdout, use `tail -f collector.log`
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 50

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource/add_cloud]
      exporters: [awsxray, debug]

  telemetry:
    logs:
      level: info
